name: Build hnubl Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # v2rayNG 同款方案：setup-android@v4 + 指定 cmdline-tools 版本。
      # API 37 的平台包名带 minor 后缀（platforms;android-37.0），旧版 cmdline-tools 列表里会被截断显示。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install NDK r29
        shell: bash
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          NDK_VER=$("$SDKMGR" --list 2>/dev/null | grep -oE 'ndk;29\.0\.[0-9]+' | head -n1 | cut -d';' -f2)
          if [ -z "$NDK_VER" ]; then NDK_VER="29.0.14206865"; fi
          echo "Installing ndk;$NDK_VER"
          yes | "$SDKMGR" --channel=0 --install "ndk;${NDK_VER}"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hnubl-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
