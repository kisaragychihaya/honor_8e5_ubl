name: Build hnubl Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate sdkmanager
        id: sdk
        shell: bash
        run: |
          SDKMGR=$(command -v sdkmanager || true)
          if [ -z "$SDKMGR" ]; then
            SDKMGR=$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)
          fi
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager not found under ${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
            ls "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" || true
            exit 1
          fi
          echo "Found sdkmanager: $SDKMGR"
          echo "path=$SDKMGR" >> "$GITHUB_OUTPUT"

      - name: Install SDK Platform 37 / Build Tools / NDK r29
        shell: bash
        run: |
          SDKMGR="${{ steps.sdk.outputs.path }}"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          echo "=== Available platforms (stable channel) ==="
          "$SDKMGR" --list 2>/dev/null | grep -oE 'platforms;android-[0-9]+' | sort -uV | tail -8
          NDK_VER=$("$SDKMGR" --list 2>/dev/null | grep -oE 'ndk;29\.0\.[0-9]+' | head -n1 | cut -d';' -f2)
          if [ -z "$NDK_VER" ]; then NDK_VER="29.0.14206865"; fi
          echo "Installing NDK $NDK_VER"
          if ! "$SDKMGR" --install "platforms;android-37" "build-tools;37.0.0" "ndk;${NDK_VER}" "platform-tools"; then
            echo "Stable channel failed, retrying with --channel=3"
            yes | "$SDKMGR" --channel=3 --licenses >/dev/null 2>&1 || true
            "$SDKMGR" --channel=3 --install "platforms;android-37" "build-tools;37.0.0" "ndk;${NDK_VER}" "platform-tools"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hnubl-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
